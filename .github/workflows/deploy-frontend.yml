name: Frontend CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy-frontend:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout código fonte
      uses: actions/checkout@v4

    - name: Configurar Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Instalar dependências (frontend)
      working-directory: ./frontend
      run: npm install

    - name: Buildar projeto (frontend)
      working-directory: ./frontend
      run: npm run build

    - name: Zipar build do frontend
      working-directory: ./frontend
      run: zip -r ../frontend.zip .

    - name: Deploy para Elastic Beanstalk (frontend)
      uses: einaregilsson/beanstalk-deploy@v21
      with:
        aws_access_key: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws_secret_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        application_name: app-controle-despesas-frontend
        environment_name: App-controle-despesas-frontend-env
        region: sa-east-1
        version_label: frontend-${{ github.run_number }}
        deployment_package: frontend.zip
