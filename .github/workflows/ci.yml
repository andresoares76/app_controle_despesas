name: CI - App Controle Despesas

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4
        with:
          path: app_controle_despesas

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Dependências
        working-directory: ./app_controle_despesas
        run: npm install

      - name: Buildar Projeto
        working-directory: ./app_controle_despesas
        run: npm run build
