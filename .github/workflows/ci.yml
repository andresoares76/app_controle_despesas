name: CI - App Controle Despesas

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4
        with:
          path: .  # <<< Esta linha é o segredo

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'  # ou a versão do seu projeto

      - name: Instalar Dependências
        run: npm install

      - name: Buildar Projeto
        run: npm run build

      # (Opcional) Rodar Testes
      # - name: Rodar Testes
      #   run: npm test
