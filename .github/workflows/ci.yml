name: CI - App Controle Despesas (Frontend + Backend)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    name: Build Frontend

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'  # ou ajuste se precisar outra versão

      - name: Instalar Dependências Frontend
        run: |
          cd frontend
          npm install

      - name: Buildar Frontend
        run: |
          cd frontend
          npm run build

  build-backend:
    runs-on: ubuntu-latest
    name: Build Backend
    needs: build-frontend  # Espera o frontend terminar primeiro (opcional)

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar Dependências Backend
        run: |
          cd backend
          npm install

