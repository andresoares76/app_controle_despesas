name: CI - App Controle Despesas

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Código
        uses: actions/checkout@v4  # Sem path, checkout normal!

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'  # Ajuste a versão conforme seu projeto

      - name: Instalar Dependências
        run: npm install
        working-directory: app_controle_despesas

      - name: Buildar Projeto
        run: npm run build
        working-directory: app_controle_despesas
